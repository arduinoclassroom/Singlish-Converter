sentence=Converts Sinhala (UTF-8) text to Singlish - readable English letters - for displays and fonts that can't draw Sinhala.
paragraph=Strings, buffers (no heap), any Stream (Serial, SD files, network) or as a Print wrapper around a display: print Sinhala, see Singlish. Handles vowel signs, al-lakuna, rakaransaya/yansaya conjuncts and split vowel signs. Casual or phonetic style, w for va, capitalised words. Works on AVR, ESP32, ESP8266, RP2040, STM32 and more.
